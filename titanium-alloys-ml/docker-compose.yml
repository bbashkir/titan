# Запуск системы подбора титановых сплавов в Docker.
#
#   docker compose up                       — демонстрация (без ввода с клавиатуры)
#   docker compose run --rm app             — интерактивный подбор с меню
#   docker compose run --rm app --selftest  — самопроверка системы (22 проверки)
#   docker compose run --rm app --stats     — статистика базы
#   docker compose run --rm app --list      — все записи базы
#   docker compose run --rm app --parse     — принудительное обновление базы
#   docker compose up -d scheduler          — фоновое автообновление раз в месяц
#   docker compose --profile "*" down       — остановить и убрать все контейнеры
#
# Про остановку: обычный «docker compose down» не видит сервисы из профилей,
# поэтому запущенный планировщик он не остановит. Ключ --profile "*"
# включает все профили сразу — это и есть команда полной остановки.
#
# ПОЧЕМУ ДВА СЕРВИСА.
# «docker compose up» подключает к контейнеру только вывод, но не ввод:
# это штатное поведение Compose. Интерактивное меню в таком режиме зависло бы
# на первом же вопросе. Поэтому «up» запускает сервис demo — он проходит все
# этапы работы системы на заранее заданных запросах и завершается сам.
# Для ручного подбора есть сервис app, запускаемый через «run», который
# терминал подключает полностью.

name: titanium-alloys

# Общая часть конфигурации: образ, переменные окружения, тома.
# Вынесена в якорь, чтобы не повторять её в каждом сервисе.
x-titanium-common: &titanium-common
  build: .
  image: titanium-alloys:1.0

  # init: true запускает внутри контейнера минимальный init-процесс,
  # который корректно обрабатывает Ctrl+C и не оставляет процессов-зомби.
  init: true

  environment:
    # Ключ API научных публикаций. Задаётся на хосте (export или файл .env);
    # если не задан — источник Semantic Scholar просто пропускается.
    SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    # Часовой пояс контейнера. Без него время в логах, в поле parsed_at
    # и в дате отчёта идёт по UTC и расходится с часами на компьютере.
    # Задайте свой пояс на хосте: export TZ=Asia/Yekaterinburg
    TZ: ${TZ:-UTC}

  volumes:
    # База данных и веса модели переживают пересоздание контейнера
    - ./data:/app/data
    # Логи доступны на хосте для разбора
    - ./logs:/app/logs
    # Готовые PDF-отчёты появляются в обычной папке проекта
    - ./reports/output:/app/reports/output

services:

  # ---------------------------------------------------------------------
  # Демонстрация. Это то, что запускается по «docker compose up».
  # Наполняет базу при первом запуске, обучает обе модели, прогоняет два
  # подготовленных запроса с выводом блоков А и Б, сохраняет PDF-отчёты
  # и завершается.
  # ---------------------------------------------------------------------
  demo:
    <<: *titanium-common
    container_name: titanium_demo
    command: ["--demo"]

  # ---------------------------------------------------------------------
  # Интерактивный подбор: docker compose run --rm app
  #
  # Сервис вынесен в профиль, чтобы «docker compose up» его не поднимал
  # (иначе он завис бы в ожидании ввода). Команда «run» включает профиль
  # автоматически, поэтому указывать его вручную не нужно.
  #
  #   stdin_open — не закрывать стандартный ввод контейнера;
  #   tty        — выделить псевдотерминал, иначе rich не нарисует
  #                таблицы, рамки и цвета, а ввод пойдёт без эха.
  # ---------------------------------------------------------------------
  app:
    <<: *titanium-common
    container_name: titanium_alloys
    profiles: ["interactive"]
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------
  # Фоновое автообновление базы по расписанию (раз в месяц).
  # Запускается только явно: docker compose up -d scheduler
  # (Compose сам включает профиль сервиса, названного в команде, поэтому
  #  демонстрация при этом не запускается.)
  # ---------------------------------------------------------------------
  scheduler:
    <<: *titanium-common
    container_name: titanium_scheduler
    profiles: ["scheduler"]
    command: ["--schedule"]
    restart: unless-stopped
